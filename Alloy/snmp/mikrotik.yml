    - 1.3.6.1.4.1.14988.1.1.16
    - 1.3.6.1.4.1.14988.1.1.17
    metrics:
    - name: sysUpTime
      oid: 1.3.6.1.2.1.1.3.0
      type: gauge
      help: System uptime
