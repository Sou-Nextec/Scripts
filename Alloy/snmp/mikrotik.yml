modules:
  mikrotik_v2c:
    walk:
    - 1.3.6.1.2.1.1
    - 1.3.6.1.2.1.25.1
    - 1.3.6.1.2.1.25.2
    - 1.3.6.1.2.1.2.2
    - 1.3.6.1.2.1.31.1.1
