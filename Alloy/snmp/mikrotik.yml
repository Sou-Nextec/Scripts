      oid: 1.3.6.1.4.1.14988.1.1.7.4.0
      type: gauge
      help: CPU load percent
    - name: mtxrHlMemoryUsed
      oid: 1.3.6.1.4.1.14988.1.1.7.6.0
      type: gauge
      help: Memory used bytes
    - name: mtxrHlMemoryTotal
      oid: 1.3.6.1.4.1.14988.1.1.7.7.0
      type: gauge
      help: Total memory bytes
    - name: ifOperStatus
      oid: 1.3.6.1.2.1.2.2.1.8
      type: gauge
      help: Interface operational status (1=up 2=down)
      indexes:
      - labelname: ifIndex
        type: gauge
      lookups:
      - labels:
        - ifIndex
        labelname: ifDescr
        oid: 1.3.6.1.2.1.2.2.1.2
        type: DisplayString
