# ============================================================================
# Nextec, módulo SNMP para Synology (DSM)
# Gerado por gerar_modulos.py. Não edite à mão: altere o gerador e rode de novo.
#
# Fontes: SNMPv2-MIB, IF-MIB, IF-X-MIB e SYNOLOGY-SYSTEM-MIB, SYNOLOGY-DISK-MIB, SYNOLOGY-RAID-MIB, HOST-RESOURCES-MIB e UCD-SNMP-MIB.
# Os nomes das métricas são os usados pelo painel Nextec | NAS.
#
# Segurança: este arquivo NÃO contém community, usuário ou senha. As
# credenciais ficam no snmp-auth.yml de cada cliente, gravado pelo instalador.
# ============================================================================
