    - 1.3.6.1.4.1.12356.101.13.1
    - 1.3.6.1.4.1.12356.101.13.2.1
    metrics:
    - name: sysUpTime
      oid: 1.3.6.1.2.1.1.3.0
      type: gauge
      help: System uptime
    - name: fgSysCpuUsage
      oid: 1.3.6.1.4.1.12356.101.4.1.3.0
      type: gauge
      help: CPU usage percent
    - name: fgSysMemUsage
      oid: 1.3.6.1.4.1.12356.101.4.1.4.0
      type: gauge
      help: Memory usage percent
    - name: fgSysMemCapacity
      oid: 1.3.6.1.4.1.12356.101.4.1.5.0
      type: gauge
      help: Total memory KB
    - name: fgSysSesCount
      oid: 1.3.6.1.4.1.12356.101.4.1.8.0
      type: gauge
      help: Active session count
    - name: fgSysSesRate1
      oid: 1.3.6.1.4.1.12356.101.4.1.9.0
      type: gauge
      help: New sessions per second
    - name: fgHaSystemMode
      oid: 1.3.6.1.4.1.12356.101.13.1.1.0
      type: gauge
      help: HA mode (1=standalone 2=activeActive 3=activePassive)
    - name: ifOperStatus
      oid: 1.3.6.1.2.1.2.2.1.8
      type: gauge
      help: Interface operational status (1=up 2=down)
      indexes:
      - labelname: ifIndex
        type: gauge
      lookups:
      - labels:
        - ifIndex
        labelname: ifDescr
        oid: 1.3.6.1.2.1.2.2.1.2
        type: DisplayString
