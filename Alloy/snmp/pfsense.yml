    - name: begemotBridgeStpRootCost
      oid: 1.3.6.1.4.1.12325.1.205.2.1.1.6
      type: gauge
      help: The cost of the path from this bridge to the root bridge. - 1.3.6.1.4.1.12325.1.205.2.1.1.6
      indexes:
      - labelname: begemotBridgeBaseName
        type: OctetString
    - name: begemotBridgeStpRootPort
      oid: 1.3.6.1.4.1.12325.1.205.2.1.1.7
      type: gauge
      help: The port number of the port that offers the lowest cost path from this bridge to the root bridge of the spanning
        tree. If this bridge is the root bridge, this object shall have a value of zero. - 1.3.6.1.4.1.12325.1.205.2.1.1.7
      indexes:
      - labelname: begemotBridgeBaseName
        type: OctetString
    - name: begemotBridgeStpMaxAge
      oid: 1.3.6.1.4.1.12325.1.205.2.1.1.8
      type: gauge
      help: The maximum age of Spanning Tree Protocol information received from the network on any port, before that information
        is discarded. This is the actual value that the bridge is currently using. - 1.3.6.1.4.1.12325.1.205.2.1.1.8
      indexes:
      - labelname: begemotBridgeBaseName
        type: OctetString
    - name: begemotBridgeStpHelloTime
      oid: 1.3.6.1.4.1.12325.1.205.2.1.1.9
      type: gauge
      help: The amount of time between transmission of Configuration BPDUs by this bridge on any port, when it is the root
        of the spanning tree or is trying to become so. This is the actual value that this bridge is currently using. - 1.3.6.1.4.1.12325.1.205.2.1.1.9
      indexes:
      - labelname: begemotBridgeBaseName
        type: OctetString
    - name: begemotBridgeStpHoldTime
      oid: 1.3.6.1.4.1.12325.1.205.2.1.1.10
      type: gauge
      help: This time value determines the interval length during which no more than two Configuration BPDUs shall be transmitted
        by this node, in units of hundredths of a second. - 1.3.6.1.4.1.12325.1.205.2.1.1.10
      indexes:
      - labelname: begemotBridgeBaseName
        type: OctetString
    - name: begemotBridgeStpForwardDelay
      oid: 1.3.6.1.4.1.12325.1.205.2.1.1.11
      type: gauge
      help: This value, measured in units of hundredths of a second determines how long a port will stay consecutively in
        the Listening and Learning states before transitioning to Forwarding state. This is the actual value currently used
        by the bridge as opposed to begemotBridgeStpBridgeForwardDelay, which is the value this and all bridges participating
        in the spanning tree were to use, if this was the root bridge. - 1.3.6.1.4.1.12325.1.205.2.1.1.11
      indexes:
      - labelname: begemotBridgeBaseName
        type: OctetString
    - name: begemotBridgeStpBridgeMaxAge
      oid: 1.3.6.1.4.1.12325.1.205.2.1.1.12
      type: gauge
      help: The value that all bridges participating in the spanning tree would use for MaxAge if this bridge was the root
        of the spanning tree. - 1.3.6.1.4.1.12325.1.205.2.1.1.12
      indexes:
      - labelname: begemotBridgeBaseName
        type: OctetString
    - name: begemotBridgeStpBridgeHelloTime
      oid: 1.3.6.1.4.1.12325.1.205.2.1.1.13
      type: gauge
      help: The value that all bridges participating in the spanning tree would use for HelloTime if this bridge was the root
        of the spanning tree. - 1.3.6.1.4.1.12325.1.205.2.1.1.13
      indexes:
      - labelname: begemotBridgeBaseName
        type: OctetString
    - name: begemotBridgeStpBridgeForwardDelay
      oid: 1.3.6.1.4.1.12325.1.205.2.1.1.14
      type: gauge
      help: The value that all bridges participating in the spanning tree would use for ForwardDelay if this bridge was the
        root of the spanning tree. - 1.3.6.1.4.1.12325.1.205.2.1.1.14
      indexes:
      - labelname: begemotBridgeBaseName
        type: OctetString
