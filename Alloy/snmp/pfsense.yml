      oid: 1.3.6.1.4.1.12325.1.205.2.3.1.6
      type: gauge
      help: The administratively assigned value for the contribution of this port to the path cost of paths toward the spanning
        tree root. Writing a value of '0' assigns the automatically calculated default Path Cost value to the port. If the
        default Path Cost is being used, this object returns '0' when read. This complements the object begemotBridgeStpPortPathCost
        or begemotBridgeStpPortPathCost32, which returns the operational value of the path cost. The value of this object
        MUST be retained across reinitializations of the management system. - 1.3.6.1.4.1.12325.1.205.2.3.1.6
      indexes:
      - labelname: begemotBridgeBaseName
        type: OctetString
      - labelname: begemotBridgeBasePortIfIndex
        type: gauge
