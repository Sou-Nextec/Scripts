      oid: 1.3.6.1.4.1.12325.1.205.3.1.1.1
      type: counter
      help: The total number of Forwarding Database entries that would have been learnt, but have been discarded due to Forwarding
        Address Table having reached it's maximum entries limit. - 1.3.6.1.4.1.12325.1.205.3.1.1.1
      indexes:
      - labelname: begemotBridgeBaseName
        type: OctetString
    - name: begemotBridgeTpAgingTime
      oid: 1.3.6.1.4.1.12325.1.205.3.1.1.2
      type: gauge
      help: The timeout period in seconds before aging out dynamically learnt forwarding entries. - 1.3.6.1.4.1.12325.1.205.3.1.1.2
      indexes:
      - labelname: begemotBridgeBaseName
        type: OctetString
    - name: begemotBridgeTpMaxAddresses
      oid: 1.3.6.1.4.1.12325.1.205.3.1.1.3
      type: gauge
      help: The maximum number of entires that this bridge can learn in it's Forwarding Address Table and use for making forwarding
        decisions. - 1.3.6.1.4.1.12325.1.205.3.1.1.3
      indexes:
      - labelname: begemotBridgeBaseName
        type: OctetString
    - name: begemotBridgeTpFdbAddress
      oid: 1.3.6.1.4.1.12325.1.205.3.2.1.1
      type: PhysAddress48
      help: A unicast MAC address for which the bridge has which the bridge interface has some forwarding and/or filtering
        information. - 1.3.6.1.4.1.12325.1.205.3.2.1.1
      indexes:
      - labelname: begemotBridgeBaseName
        type: OctetString
      - labelname: begemotBridgeTpFdbAddress
        type: PhysAddress48
        fixed_size: 6
    - name: begemotBridgeTpFdbPort
      oid: 1.3.6.1.4.1.12325.1.205.3.2.1.2
      type: gauge
      help: The port number of the bridge port on which a frame having a source address equal to the value of the corresponding
        instance of begemotBridgeTpFdbAddress has been seen. - 1.3.6.1.4.1.12325.1.205.3.2.1.2
      indexes:
      - labelname: begemotBridgeBaseName
        type: OctetString
      - labelname: begemotBridgeTpFdbAddress
        type: PhysAddress48
        fixed_size: 6
    - name: begemotBridgeTpFdbStatus
      oid: 1.3.6.1.4.1.12325.1.205.3.2.1.3
      type: gauge
      help: 'The status of this entry. The meanings of the values are: other(1) - none of the following. invalid(2) - this
        entry is no longer valid (e.g., it was learned but has since aged out), but has not yet been flushed from the table.
        learned(3) - the value of the corresponding instance of begemotBridgeTpFdbPort was learned, and is being used. self(4)
        - the value of the corresponding instance of begemotBridgeTpFdbAddress represents one of the bridge''s addresses.
        The corresponding instance of begemotBridgeTpFdbPort indicates which of the bridge''s ports has this address. mgmt(5)
        - the value of the corresponding instance of begemotBridgeTpFdbAddress has been added to the bridge''s Forwarding
        Database by some management means. - 1.3.6.1.4.1.12325.1.205.3.2.1.3'
      indexes:
      - labelname: begemotBridgeBaseName
        type: OctetString
      - labelname: begemotBridgeTpFdbAddress
        type: PhysAddress48
        fixed_size: 6
      enum_values:
        1: other
        2: invalid
        3: learned
        4: self
        5: mgmt
    - name: begemotBridgeTpPort
      oid: 1.3.6.1.4.1.12325.1.205.3.3.1.1
      type: gauge
      help: The system interface index of the port for which this entry contains Transparent bridging management information.
        - 1.3.6.1.4.1.12325.1.205.3.3.1.1
      indexes:
      - labelname: begemotBridgeBaseName
        type: OctetString
      - labelname: begemotBridgeBasePortIfIndex
        type: gauge
