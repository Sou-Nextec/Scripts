      oid: 1.3.6.1.4.1.12325.1.205.2.1.1.15
      type: gauge
      help: The version of Spanning Tree Protocol the bridge is currently running. The value 'stpCompatible(0)' indicates
        the Spanning Tree Protocol specified in IEEE 802.1D-1998 and 'rstp(2)' indicates the Rapid Spanning Tree Protocol
        specified in IEEE 802.1w and clause 17 of 802.1D-2004. The values are directly from the IEEE standard. New values
        may be defined as future versions of the protocol become available. The value of this object MUST be retained across
        reinitializations of the management system. - 1.3.6.1.4.1.12325.1.205.2.1.1.15
      indexes:
      - labelname: begemotBridgeBaseName
        type: OctetString
      enum_values:
        0: stpCompatible
        2: rstp
    - name: begemotBridgeStpTxHoldCount
      oid: 1.3.6.1.4.1.12325.1.205.2.1.1.16
      type: gauge
      help: The value used by the Port Transmit state machine to limit the maximum transmission rate of BPDUs on the bridge
        interface. The value of this object MUST be retained across reinitializations of the management system. - 1.3.6.1.4.1.12325.1.205.2.1.1.16
      indexes:
      - labelname: begemotBridgeBaseName
        type: OctetString
    - name: begemotBridgeStpPort
      oid: 1.3.6.1.4.1.12325.1.205.2.2.1.1
      type: gauge
      help: The system interface index of the interface corresponding to this port, for which the management entity has Spanning
        Tree Protocol information. - 1.3.6.1.4.1.12325.1.205.2.2.1.1
      indexes:
      - labelname: begemotBridgeBaseName
        type: OctetString
      - labelname: begemotBridgeBasePortIfIndex
        type: gauge
    - name: begemotBridgeStpPortPriority
      oid: 1.3.6.1.4.1.12325.1.205.2.2.1.2
      type: gauge
      help: The STP priority of this port that is contained in the first octet of its Port Identifier. The second octet contains
        the value of begemotBridgeStpPort. - 1.3.6.1.4.1.12325.1.205.2.2.1.2
      indexes:
      - labelname: begemotBridgeBaseName
        type: OctetString
      - labelname: begemotBridgeBasePortIfIndex
        type: gauge
    - name: begemotBridgeStpPortState
      oid: 1.3.6.1.4.1.12325.1.205.2.2.1.3
      type: gauge
      help: The current state of the port as defined by the operation of the Spanning Tree Protocol. If the Spanning Tree
        Protocol is administratively disabled on the port, this object shall have value disabled(1). A value of broken(6)
        does not correspond to any legal state of a port, and if present should indicate error in the operation of either
        the Spanning Tree Protocol implementation running on the device or the management entity. - 1.3.6.1.4.1.12325.1.205.2.2.1.3
      indexes:
      - labelname: begemotBridgeBaseName
        type: OctetString
      - labelname: begemotBridgeBasePortIfIndex
        type: gauge
      enum_values:
        1: disabled
        2: blocking
        3: listening
        4: learning
        5: forwarding
        6: broken
    - name: begemotBridgeStpPortEnable
      oid: 1.3.6.1.4.1.12325.1.205.2.2.1.4
      type: gauge
      help: The administrative Spanning Tree Protocol state of the port - value of enabled(1) indicates that the port is participating
        in the Spanning Tree Protocol operation. - 1.3.6.1.4.1.12325.1.205.2.2.1.4
      indexes:
      - labelname: begemotBridgeBaseName
        type: OctetString
      - labelname: begemotBridgeBasePortIfIndex
        type: gauge
      enum_values:
        1: enabled
        2: disabled
    - name: begemotBridgeStpPortPathCost
      oid: 1.3.6.1.4.1.12325.1.205.2.2.1.5
      type: gauge
      help: The contribution of the path through this port, when the port is the Root Port, to the total cost of the path
        to the root bridge for this bridge. - 1.3.6.1.4.1.12325.1.205.2.2.1.5
      indexes:
      - labelname: begemotBridgeBaseName
        type: OctetString
      - labelname: begemotBridgeBasePortIfIndex
        type: gauge
    - name: begemotBridgeStpPortDesignatedRoot
      oid: 1.3.6.1.4.1.12325.1.205.2.2.1.6
      type: OctetString
      help: The unique Bridge Identifier of the bridge recorded as the root in the Root Identifier parameter of Configuration
        BPDUs transmitted by the Designated Bridge for the LAN to which the port is attached. - 1.3.6.1.4.1.12325.1.205.2.2.1.6
      indexes:
      - labelname: begemotBridgeBaseName
        type: OctetString
      - labelname: begemotBridgeBasePortIfIndex
        type: gauge
    - name: begemotBridgeStpPortDesignatedCost
      oid: 1.3.6.1.4.1.12325.1.205.2.2.1.7
      type: gauge
      help: For a Designated port, the path cost (equal to the Root Path Cost of the bridge) offered to the LAN to which the
        port is attached otherwise the cost of the path to the Root offered by the Designated Port on the LAN to which this
        Port is attached. - 1.3.6.1.4.1.12325.1.205.2.2.1.7
      indexes:
      - labelname: begemotBridgeBaseName
        type: OctetString
      - labelname: begemotBridgeBasePortIfIndex
        type: gauge
    - name: begemotBridgeStpPortDesignatedBridge
      oid: 1.3.6.1.4.1.12325.1.205.2.2.1.8
      type: OctetString
      help: The unique Bridge Identifier of the bridge to which the port belongs, in the case when the port is a designated
        port, otherwise the bridge believed to be the Designated Bridge for the LAN to which this port is attached. - 1.3.6.1.4.1.12325.1.205.2.2.1.8
      indexes:
      - labelname: begemotBridgeBaseName
        type: OctetString
      - labelname: begemotBridgeBasePortIfIndex
        type: gauge
    - name: begemotBridgeStpPortDesignatedPort
      oid: 1.3.6.1.4.1.12325.1.205.2.2.1.9
      type: OctetString
      help: The Port Identifier of the Bridge port, on the Designated Bridge, through which the Designated Bridge transmits
        the Configuration Message information stored by this port. - 1.3.6.1.4.1.12325.1.205.2.2.1.9
      indexes:
      - labelname: begemotBridgeBaseName
        type: OctetString
      - labelname: begemotBridgeBasePortIfIndex
        type: gauge
    - name: begemotBridgeStpPortForwardTransitions
      oid: 1.3.6.1.4.1.12325.1.205.2.2.1.10
      type: counter
      help: The number of times this port has transitioned from the Learning state to the Forwarding state. - 1.3.6.1.4.1.12325.1.205.2.2.1.10
      indexes:
      - labelname: begemotBridgeBaseName
        type: OctetString
      - labelname: begemotBridgeBasePortIfIndex
        type: gauge
    - name: begemotBridgeStpPortProtocolMigration
      oid: 1.3.6.1.4.1.12325.1.205.2.3.1.1
      type: gauge
      help: When operating in RSTP (version 2) mode, writing true(1) to this object forces this port to transmit RSTP BPDUs.
        Any other operation on this object has no effect and it always returns false(2) when read. - 1.3.6.1.4.1.12325.1.205.2.3.1.1
      indexes:
      - labelname: begemotBridgeBaseName
        type: OctetString
      - labelname: begemotBridgeBasePortIfIndex
        type: gauge
    - name: begemotBridgeStpPortAdminEdgePort
      oid: 1.3.6.1.4.1.12325.1.205.2.3.1.2
      type: gauge
      help: The administrative value of the Edge Port parameter. A value of true(1) indicates that this port should be assumed
        as an edge-port, and a value of false(2) indicates that this port should be assumed as a non-edge-port. Setting this
        object will also cause the corresponding instance of begemotBridgeStpPortOperEdgePort to change to the same value.
        Note that even when this object's value is true, the value of the corresponding instance of begemotBridgeStpPortOperEdgePort
        can be false if a BPDU has been received. The value of this object MUST be retained across reinitializations of the
        management system. - 1.3.6.1.4.1.12325.1.205.2.3.1.2
      indexes:
      - labelname: begemotBridgeBaseName
        type: OctetString
      - labelname: begemotBridgeBasePortIfIndex
        type: gauge
    - name: begemotBridgeStpPortOperEdgePort
      oid: 1.3.6.1.4.1.12325.1.205.2.3.1.3
      type: gauge
      help: The operational value of the Edge Port parameter. The object is initialized to the value of the corresponding
        instance of begemotBridgeStpPortAdminEdgePort. When the corresponding instance of begemotBridgeStpPortAdminEdgePort
        is set, this object will be changed as well. This object will also be changed to false on reception of a BPDU. - 1.3.6.1.4.1.12325.1.205.2.3.1.3
      indexes:
      - labelname: begemotBridgeBaseName
        type: OctetString
      - labelname: begemotBridgeBasePortIfIndex
        type: gauge
    - name: begemotBridgeStpPortAdminPointToPoint
      oid: 1.3.6.1.4.1.12325.1.205.2.3.1.4
      type: gauge
      help: The administrative point-to-point status of the LAN segment attached to this port, using the enumeration values
        of the IEEE 802.1w clause. A value of forceTrue(0) indicates that this port should always be treated as if it is connected
        to a point-to-point link. A value of forceFalse(1) indicates that this port should be treated as having a shared media
        connection. A value of auto(2) indicates that this port is considered to have a point-to-point link if it is an Aggregator
        and all of its members are aggregatable, or if the MAC entity is configured for full duplex operation, either through
        auto-negotiation or by management means. Manipulating this object changes the underlying adminPortToPortMAC. The value
        of this object MUST be retained across reinitializations of the management system. - 1.3.6.1.4.1.12325.1.205.2.3.1.4
      indexes:
      - labelname: begemotBridgeBaseName
        type: OctetString
      - labelname: begemotBridgeBasePortIfIndex
        type: gauge
      enum_values:
        0: forceTrue
        1: forceFalse
        2: auto
    - name: begemotBridgeStpPortOperPointToPoint
      oid: 1.3.6.1.4.1.12325.1.205.2.3.1.5
      type: gauge
      help: The operational point-to-point status of the LAN segment attached to this port. It indicates whether a port is
        considered to have a point-to-point connection. If adminPointToPointMAC is set to auto(2), then the value of operPointToPointMAC
        is determined in accordance with the specific procedures defined for the MAC entity concerned, as defined in IEEE
        802.1w, clause 6.5. The value is determined dynamically; that is, it is re-evaluated whenever the value of adminPointToPointMAC
        changes, and whenever the specific procedures defined for the MAC entity evaluates a change in its point-to-point
        status. - 1.3.6.1.4.1.12325.1.205.2.3.1.5
      indexes:
      - labelname: begemotBridgeBaseName
        type: OctetString
      - labelname: begemotBridgeBasePortIfIndex
        type: gauge
