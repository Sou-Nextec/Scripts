      indexes:
      - labelname: wlanIfaceName
        type: DisplayString
      enum_values:
        1: fcc
        2: ca
        3: etsi
        4: etsi2
        5: etsi3
        6: fcc3
        7: japan
        8: korea
        9: apac
        10: apac2
        11: apac3
        12: row
        13: none
        14: debug
        15: sr9
        16: xr9
        17: gz901
