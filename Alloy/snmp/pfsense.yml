        include all environments in the specified country. 2. an ASCII ''O'' character, if the country''s regulations are
        for Outdoor environment only. 3. an ASCII ''I'' character, if the country''s regulations are for Indoor environment
        only. - 1.3.6.1.4.1.12325.1.210.1.3.1.2'
      indexes:
      - labelname: wlanIfaceName
        type: DisplayString
