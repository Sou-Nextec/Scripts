# ==============================================================================
# Nextec, módulo SNMP completo para pfSense / FreeBSD
# Compatível com prometheus.exporter.snmp do Grafana Alloy / snmp_exporter.
#
# Fontes incorporadas:
#   Standard: SNMPv2-MIB, IF-MIB, IF-X-MIB, HOST-RESOURCES-MIB,
#             IP-MIB e UCD-SNMP-MIB.
#   pfSense/FreeBSD: todas as famílias publicadas no diretório de MIBs indicado:
#     BEGEMOT-ATM-FREEBSD-MIB, BEGEMOT-ATM, BEGEMOT-BRIDGE-MIB,
#     BEGEMOT-HAST-MIB, BEGEMOT-HOSTRES-MIB, BEGEMOT-IP-MIB,
#     BEGEMOT-MIB, BEGEMOT-MIB2-MIB, BEGEMOT-NETGRAPH,
#     BEGEMOT-PF-MIB, BEGEMOT-SNMPD e BEGEMOT-WIRELESS-MIB.
#
# Segurança:
#   Este arquivo NÃO contém community, usuário, senha, auth key ou priv key.
#   As credenciais permanecem no arquivo auths separado por cliente.
#
# Observação operacional:
#   O arquivo é propositalmente abrangente. Um pfSense só responderá às árvores
#   que o daemon SNMP e os módulos carregados realmente expuserem.
# ==============================================================================
