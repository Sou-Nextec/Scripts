      type: counter
      help: The number of frames that have been transmitted by this port to its segment. Note that a frame transmitted on
        the interface corresponding to this port is only counted by this object if and only if it is for a protocol being
        processed by the local bridging function, including bridge management frames. - 1.3.6.1.4.1.12325.1.205.3.3.1.4
      indexes:
      - labelname: begemotBridgeBaseName
        type: OctetString
      - labelname: begemotBridgeBasePortIfIndex
        type: gauge
